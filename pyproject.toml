[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfsplitter"
version = "1.0.0"
description = "Split a large, bookmarked PDF into one file per chapter while keeping internal hyperlinks working across the resulting files"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Lewin" }]
keywords = ["pdf", "split", "bookmarks", "hyperlinks", "pikepdf", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "pikepdf>=9",
    "reportlab>=4",
]

[project.urls]
Homepage = "https://github.com/MattLewin/pdfsplitter"
Repository = "https://github.com/MattLewin/pdfsplitter"
Issues = "https://github.com/MattLewin/pdfsplitter/issues"

[project.scripts]
pdfsplitter = "split_manual:main"
pdfsplitter-verify = "verify:main"

[dependency-groups]
dev = [
    "black>=26",
    "mdformat-gfm>=1.0",
    "pre-commit>=3.7",
    "ruff>=0.16",
]

[tool.hatch.build.targets.wheel]
only-include = ["split_manual.py", "verify.py"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
